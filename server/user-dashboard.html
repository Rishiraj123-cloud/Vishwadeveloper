<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard | VISHWA DEVELOPERS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .welcome-banner { background: linear-gradient(135deg, #a67c4e 0%, #0b1a2f 100%); color: white; padding: 4rem 2.5rem; border-radius: 0 0 40px 40px; position: relative; overflow: hidden; margin-bottom: 3rem; }
    .heart-particle { position: absolute; bottom: -20px; color: rgba(255,255,255,0.25); font-size: 1.2rem; animation: floatUp linear infinite; pointer-events: none; }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-320px) translateX(var(--drift, 20px)) rotate(25deg); opacity: 0; }
    }
    .sparkle { position: absolute; width: 6px; height: 6px; background: #f0d8bb; border-radius: 50%; opacity: 0; animation: sparklePop 2.4s ease-in-out infinite; }
    @keyframes sparklePop { 0%, 100% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1); } }
    .welcome-content { position: relative; z-index: 2; opacity: 0; transform: translateY(16px) scale(0.98); animation: welcomePop 0.9s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes welcomePop { to { opacity: 1; transform: translateY(0) scale(1); } }
    .welcome-content h2 { font-family: 'Fraunces', serif; font-size: 2.1rem; margin-bottom: 0.5rem; }
    .welcome-content h2 i { display: inline-block; animation: wiggle 1.8s ease-in-out infinite; transform-origin: 70% 70%; }
    @keyframes wiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
    .welcome-content p { color: #f5e6d3; font-size: 0.95rem; }
    .welcome-stat { display: inline-flex; align-items: baseline; gap: 0.4rem; margin-top: 1.2rem; background: rgba(255,255,255,0.12); padding: 0.6rem 1.2rem; border-radius: 40px; backdrop-filter: blur(8px); animation: statGlow 2.5s ease-in-out infinite; }
    @keyframes statGlow { 0%,100% { box-shadow: 0 0 0 rgba(240,216,187,0); } 50% { box-shadow: 0 0 18px rgba(240,216,187,0.35); } }
    .welcome-stat span.count { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 700; color: #f0d8bb; }
    .grid-3.reveal-stagger .listing-card { opacity: 0; transform: translateY(24px) scale(0.96); transition: opacity 0.6s cubic-bezier(0.34,1.56,0.64,1), transform 0.6s cubic-bezier(0.34,1.56,0.64,1); }
    .grid-3.reveal-stagger.in-view .listing-card { opacity: 1; transform: translateY(0) scale(1); }
    .grid-3.reveal-stagger .listing-card:nth-child(1) { transition-delay: 0.05s; }
    .grid-3.reveal-stagger .listing-card:nth-child(2) { transition-delay: 0.15s; }
    .grid-3.reveal-stagger .listing-card:nth-child(3) { transition-delay: 0.25s; }
    .grid-3.reveal-stagger .listing-card:nth-child(4) { transition-delay: 0.35s; }
    .grid-3.reveal-stagger .listing-card:nth-child(5) { transition-delay: 0.45s; }
    .grid-3.reveal-stagger .listing-card:nth-child(6) { transition-delay: 0.55s; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #5b6f82; }
    .unsave-btn { background: #fdeeee; color: #c0392b; border: none; padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .unsave-btn:hover { background: #f8d7d7; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">VISHWA<span>DEVELOPERS</span></div>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="listings.html"><i class="fas fa-building"></i> Listings</a></li>
        <li><a href="agents.html"><i class="fas fa-user-tie"></i> Agents</a></li>
        <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
        <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
        <li><a href="#" id="logoutBtn" class="nav-cta">Logout</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
  </header>

  <section class="welcome-banner" id="welcomeBanner">
    <div class="welcome-content">
      <h2>Welcome back, <span id="userName">there</span> <i class="fas fa-hand-sparkles"></i></h2>
      <p>Here's a quick look at the properties you've saved.</p>
      <div class="welcome-stat"><span class="count" id="favCount">0</span> Saved Properties</div>
    </div>
  </section>

  <section class="section-pad" style="padding-top: 0;">
    <div id="favoritesList" class="grid-3 reveal-stagger"></div>
  </section>

  <footer class="footer">
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="listings.html">Listings</a>
      <a href="agents.html">Agents</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <p>&copy; 2026 Vishwa Developers. All rights reserved.</p>
  </footer>

  <script>
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');

    if (!token || !userStr) { window.location.href = 'login.html'; }
    const user = JSON.parse(userStr);
    if (user.role !== 'user') { window.location.href = 'login.html'; }
    document.getElementById('userName').textContent = user.fullName;

    document.getElementById('navToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    function spawnBannerParticles() {
      const banner = document.getElementById('welcomeBanner');
      for (let i = 0; i < 6; i++) {
        const heart = document.createElement('i');
        heart.className = 'fas fa-heart heart-particle';
        heart.style.left = Math.random() * 90 + '%';
        heart.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
        heart.style.animationDuration = (6 + Math.random() * 4) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        banner.appendChild(heart);
      }
      for (let i = 0; i < 10; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 2.4) + 's';
        banner.appendChild(s);
      }
    }
    spawnBannerParticles();

    async function loadFavorites() {
      const res = await fetch('/api/favorites', { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      const list = document.getElementById('favoritesList');
      const count = data.favorites ? data.favorites.length : 0;

      document.getElementById('favCount').textContent = count;

      if (count === 0) {
        list.innerHTML = '<div class="empty-state"><i class="fas fa-heart" style="font-size:2rem;margin-bottom:0.8rem;display:block;"></i>No saved properties yet. Browse <a href="listings.html" style="color:#a67c4e;font-weight:600;">listings</a> to save some.</div>';
        return;
      }

      list.innerHTML = data.favorites.map(p => `
        <div class="listing-card">
          <div class="listing-img"><span class="listing-badge">${p.purpose === 'sale' ? 'For Sale' : 'For Rent'}</span></div>
          <div class="listing-body">
            <h3>${p.title}</h3>
            <p class="listing-loc"><i class="fas fa-location-dot"></i>${p.location}</p>
            <div class="listing-meta">
              ${p.beds ? `<span><i class="fas fa-bed"></i> ${p.beds} Beds</span>` : ''}
              ${p.baths ? `<span><i class="fas fa-bath"></i> ${p.baths} Baths</span>` : ''}
              ${p.sqft ? `<span><i class="fas fa-ruler-combined"></i> ${p.sqft} sqft</span>` : ''}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="listing-price">${p.price}</div>
              <button class="unsave-btn" onclick="removeFavorite(${p.id})"><i class="fas fa-heart-crack"></i> Remove</button>
            </div>
          </div>
        </div>
      `).join('');

      revealObserver.observe(list);
    }

    async function removeFavorite(id) {
      await fetch('/api/favorites/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
      loadFavorites();
    }

    loadFavorites();
  </script>
</body>
</html>
