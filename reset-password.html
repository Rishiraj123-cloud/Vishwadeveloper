<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | VISHWA DEVELOPERS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-container { max-width: 450px; margin: 4rem auto; padding: 2.5rem; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(11, 26, 47, 0.05); }
    .auth-title { font-family: 'Fraunces', serif; font-size: 2rem; color: #0b1a2f; margin-bottom: 0.5rem; text-align: center; }
    .auth-subtitle { color: #5b6f82; text-align: center; margin-bottom: 2rem; }
    .auth-form label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: #2d4055; }
    .auth-form input { width: 100%; padding: 0.8rem 1rem; border: 1px solid #c9d3df; border-radius: 8px; margin-bottom: 1.5rem; font-family: 'Work Sans', sans-serif; font-size: 1rem; transition: border-color 0.3s; }
    .auth-form input:focus { border-color: #a67c4e; outline: none; box-shadow: 0 0 0 3px rgba(166, 124, 78, 0.1); }
    .auth-form .btn-primary { width: 100%; justify-content: center; font-size: 1.1rem; padding: 0.9rem; margin-top: 1rem; }
    .auth-footer { margin-top: 1.5rem; text-align: center; color: #5b6f82; font-size: 0.95rem; }
    .auth-footer a { color: #a67c4e; font-weight: 500; text-decoration: none; }
    .error-msg { color: #e74c3c; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; display: none; }
    .success-msg { color: #2e7d32; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; display: none; }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo"><img src="logoVD.png" alt="Vishwa Developers Logo" class="nav-logo"></a>
  </header>

  <div class="auth-container">
    <h1 class="auth-title">New Password</h1>
    <p class="auth-subtitle">Create a new secure password.</p>
    
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>
    
    <form class="auth-form" id="resetForm">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" />
      
      <button type="submit" class="btn-primary" id="submitBtn">Save Password</button>
    </form>
    
    <div class="auth-footer" id="loginLink" style="display:none;">
      <a href="login.html" class="btn-primary" style="display:inline-block; margin-top:1rem; width:100%;">Go to Login</a>
    </div>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const newPassword = document.getElementById('newPassword').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const btn = document.getElementById('submitBtn');
      const form = document.getElementById('resetForm');
      const loginLink = document.getElementById('loginLink');
      
      if (!token) {
        errorMsg.textContent = "Invalid or missing reset token.";
        errorMsg.style.display = 'block';
        return;
      }
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      btn.textContent = 'Saving...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');
        
        successMsg.textContent = data.message;
        successMsg.style.display = 'block';
        form.style.display = 'none';
        loginLink.style.display = 'block';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btn.textContent = 'Save Password';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
