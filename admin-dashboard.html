<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Dashboard | VISHWA DEVELOPERS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-banner { background: #0b1a2f; color: white; padding: 3rem 2.5rem; border-radius: 0 0 28px 28px; margin-bottom: 3rem; }
    .admin-banner h2 { font-family: 'Fraunces', serif; font-size: 2rem; margin-bottom: 0.3rem; }
    .admin-nav { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem; }
    .admin-nav button { background: none; border: none; font-size: 1.05rem; font-weight: 600; color: #5b6f82; cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; transition: all 0.2s; }
    .admin-nav button.active { background: #a67c4e; color: white; }
    .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    .data-table th, .data-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
    .data-table th { background: #f8fafc; font-weight: 600; color: #2d4055; }
    .data-table tr:hover { background: #f8fafc; }
    .delete-btn { color: #e74c3c; background: none; border: none; cursor: pointer; font-size: 1.1rem; }
    .delete-btn:hover { color: #c0392b; }
    .view-link { color: #0b1a2f; text-decoration: none; font-weight: 600; margin-right: 1rem; }
    .view-link:hover { color: #a67c4e; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">VISHWA<span>DEVELOPERS</span></div>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="#" id="logoutBtn" class="nav-cta">Logout</a></li>
      </ul>
    </nav>
  </header>

  <section class="admin-banner">
    <h2>Super Admin Console</h2>
    <p style="color:#c3d1e0; font-size:0.95rem;">Manage all users and properties.</p>
  </section>

  <section class="section-pad" style="padding-top: 0;">
    <div class="admin-nav">
      <button id="tabUsers" class="active">Manage Users</button>
      <button id="tabProperties">Manage Properties</button>
    </div>

    <div id="usersPanel">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Admin</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTbody">
          <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="propertiesPanel" style="display:none;">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Owner</th>
            <th>Price</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="propertiesTbody">
          <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');

    if (!token || !userStr) window.location.href = 'login.html';
    const user = JSON.parse(userStr);
    if (!user.is_admin) {
      alert('Access Denied.');
      window.location.href = 'index.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    const tabUsers = document.getElementById('tabUsers');
    const tabProperties = document.getElementById('tabProperties');
    const usersPanel = document.getElementById('usersPanel');
    const propertiesPanel = document.getElementById('propertiesPanel');

    tabUsers.addEventListener('click', () => {
      tabUsers.classList.add('active'); tabProperties.classList.remove('active');
      usersPanel.style.display = 'block'; propertiesPanel.style.display = 'none';
      loadUsers();
    });
    tabProperties.addEventListener('click', () => {
      tabProperties.classList.add('active'); tabUsers.classList.remove('active');
      propertiesPanel.style.display = 'block'; usersPanel.style.display = 'none';
      loadProperties();
    });

    async function loadUsers() {
      const res = await fetch('/api/admin/users', { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      const tbody = document.getElementById('usersTbody');
      tbody.innerHTML = data.users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.full_name}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>${u.is_admin ? 'Yes' : 'No'}</td>
          <td>
            ${!u.is_admin ? `<button class="delete-btn" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i></button>` : '-'}
          </td>
        </tr>
      `).join('');
    }

    async function loadProperties() {
      const res = await fetch('/api/admin/properties', { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      const tbody = document.getElementById('propertiesTbody');
      tbody.innerHTML = data.properties.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.title}</td>
          <td>${p.owner_name} (${p.owner_email})</td>
          <td>${p.price}</td>
          <td>${p.property_type}</td>
          <td>
            <a href="property-details.html?id=${p.id}" class="view-link" target="_blank"><i class="fas fa-eye"></i></a>
            <button class="delete-btn" onclick="deleteProperty(${p.id})"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteUser(id) {
      if(!confirm('Are you sure you want to delete this user AND all their properties?')) return;
      await fetch('/api/admin/users/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
      loadUsers();
    }

    async function deleteProperty(id) {
      if(!confirm('Delete this property permanently?')) return;
      await fetch('/api/admin/properties/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
      loadProperties();
    }

    // Init
    loadUsers();
  </script>
</body>
</html>
